name: Публикация версии лаунчера

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - release.json
      - RELEASE_NOTES.md
      - scripts/prepare_release.py
      - scripts/verify_setup.py
      - scripts/verify_shell_shortcuts.py
      - scripts/verify_vr_texture.py
      - installer/tvd_rally.iss
      - .github/workflows/publish-release.yml

permissions:
  contents: write

concurrency:
  group: publish-public-release
  cancel-in-progress: false

jobs:
  notes:
    if: startsWith(github.event.head_commit.message, '[notes]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Получить описание выпуска
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Обновить только описание существующего выпуска
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          gh release edit "v$VERSION" --notes-file RELEASE_NOTES.md
  publish:
    if: "!startsWith(github.event.head_commit.message, '[notes]')"
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Получить описание выпуска
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Скачать и проверить публичную сборку
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_release.py

      - name: Собрать установщик для Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $version = (Get-Content release.json -Raw | ConvertFrom-Json).version
            Expand-Archive -LiteralPath "TVD-Rally-$version.zip" -DestinationPath dist
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить Inno Setup' }
            }
            if (-not (Test-Path $iscc)) { throw "Компилятор не найден: $iscc" }
            & $iscc "/DAppVer=$version" installer\tvd_rally.iss 2>&1 | Tee-Object -Variable compilerOutput
            if ($LASTEXITCODE -ne 0) {
              $compilerOutput | Select-Object -Last 12 | ForEach-Object { Write-Output "::error::ISCC: $_" }
              throw "Компилятор завершился с кодом $LASTEXITCODE"
            }
            $setup = Get-Item "Output\TVD-Rally-Setup-$version.exe"
            $fileVersion = "{0}.{1}.{2}" -f $setup.VersionInfo.FileMajorPart, $setup.VersionInfo.FileMinorPart, $setup.VersionInfo.FileBuildPart
            Write-Output "Версия установщика: $fileVersion"
            if ($fileVersion -ne $version) {
              throw "Версия установщика $fileVersion не совпадает с $version"
            }
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            throw
          }

      - name: Проверить установку и состав файлов
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release.json -Raw | ConvertFrom-Json).version
          $setup = (Resolve-Path "Output\TVD-Rally-Setup-$version.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'TVD-Setup-Check'
          $log = Join-Path $env:RUNNER_TEMP 'tvd-setup-check.log'
          $install = Start-Process -FilePath $setup -ArgumentList @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""', "/DIR=`"$destination`"", "/LOG=`"$log`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Установка завершилась с кодом $($install.ExitCode)"
          }
          foreach ($check in @('scripts/verify_setup.py', 'scripts/verify_shell_shortcuts.py', 'scripts/verify_vr_texture.py')) {
            $checkOutput = & python $check "$destination" 2>&1
            $checkCode = $LASTEXITCODE
            $checkOutput | ForEach-Object { Write-Output $_ }
            if ($checkCode -ne 0) {
              $checkOutput | Select-Object -Last 14 | ForEach-Object { Write-Output "::error::$_" }
              exit $checkCode
            }
          }

      - name: Опубликовать файлы в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("release.json"))["version"])')"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft \
              --title "TVD Rally — версия $VERSION" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" "TVD-Rally-$VERSION.zip" "Output/TVD-Rally-Setup-$VERSION.exe" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "TVD Rally — версия $VERSION" --notes-file RELEASE_NOTES.md --draft=false --latest
