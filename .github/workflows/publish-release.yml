name: Публикация версии лаунчера

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - release.json
      - RELEASE_NOTES.md
      - scripts/prepare_release.py
      - .github/workflows/publish-release.yml

permissions:
  contents: write

concurrency:
  group: publish-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить описание выпуска
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Скачать и проверить публичную сборку
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_release.py

      - name: Опубликовать файлы в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          TAG="v$VERSION"
          gh release create "$TAG" --verify-tag --draft \
            --title "TVD Rally — версия $VERSION" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" "TVD-Rally-$VERSION.zip" SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
